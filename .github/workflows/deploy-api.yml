# Typechecks and builds the backend, then asks Render to deploy it.
#
# GitHub Actions cannot HOST the API — Actions runners are short-lived job
# containers, and Pages serves static files only. What it can do is gate the
# deploy on a green build, which Render's own auto-deploy does not.
#
# Setup: Render dashboard → your service → Settings → Deploy Hook → copy the URL
#        into Settings → Secrets and variables → Actions → RENDER_DEPLOY_HOOK
#        Then turn OFF Render's "Auto-Deploy" so this workflow is the only path.
name: Deploy API to Render

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      # Build before deploying: Render's free tier gives no rollback, so a
      # broken build there means downtime until the next push.
      - run: npm run typecheck
        working-directory: backend
      - run: npm run build
        working-directory: backend

      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK secret is not set."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$HOOK")
          echo "Render responded $code"
          [ "$code" = "200" ] || [ "$code" = "201" ] || exit 1
          echo "Deploy queued. Watch it in the Render dashboard."
